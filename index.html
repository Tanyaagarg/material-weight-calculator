<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Material Weight Calculator — calculate total weight of materials based on thickness, height, length and quantity." />
  <title>Material Weight Calculator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ===== CSS RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fa;
      --bg-white: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f8f9fb;
      --border: #e2e6ed;
      --border-light: #eef1f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: rgba(37, 99, 235, 0.08);
      --primary-soft: rgba(37, 99, 235, 0.12);
      --text: #1a1d26;
      --text-secondary: #5a6072;
      --text-muted: #8b91a5;
      --accent: #16a34a;
      --accent-light: rgba(22, 163, 74, 0.08);
      --danger: #dc2626;
      --danger-light: rgba(220, 38, 38, 0.07);
      --danger-border: rgba(220, 38, 38, 0.18);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.07), 0 4px 8px rgba(0, 0, 0, 0.04);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: 0.2s ease;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html { font-size: 17px; scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== LAYOUT ===== */
    .app {
      position: relative;
      max-width: 740px;
      margin: 0 auto;
      padding: 32px 20px 90px;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.5s ease-out;
    }
    .header__icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      display: inline-block;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 8px;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      animation: fadeUp 0.4s ease-out both;
    }
    .card--form { animation-delay: 0.08s; }
    .card--list { animation-delay: 0.16s; }
    .card--total { animation-delay: 0.24s; }

    .card__title {
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--primary);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card__title::before {
      content: '';
      display: inline-block;
      width: 4px; height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* ===== FORM ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group--full { grid-column: 1 / -1; }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    select, input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      appearance: none;
      -webkit-appearance: none;
    }
    select {
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%235a6072' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
      cursor: pointer;
    }
    select option {
      background: var(--bg-white);
      color: var(--text);
    }
    input::placeholder { color: var(--text-muted); }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn--primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }
    .btn--primary:hover {
      background: var(--primary-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .btn--primary:active { transform: translateY(0); }

    .btn--danger {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }
    .btn--danger:hover {
      background: rgba(220, 38, 38, 0.12);
    }

    .btn--ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1.5px solid var(--border);
    }
    .btn--ghost:hover {
      color: var(--text);
      border-color: #c5cad6;
      background: var(--bg);
    }

    .btn--sm {
      padding: 10px 16px;
      font-size: 0.85rem;
      border-radius: 10px;
    }

    .form-actions {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }
    .form-actions .btn { flex: 1; }

    /* ===== ERROR TOAST ===== */
    .error-msg {
      background: var(--danger-light);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 18px;
      display: none;
      animation: shake 0.35s ease-out;
    }
    .error-msg.visible { display: block; }

    /* ===== ITEMS LIST ===== */
    .items-empty {
      text-align: center;
      padding: 36px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .items-empty__icon {
      font-size: 2.4rem;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .item-entry {
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: all var(--transition);
      animation: slideIn 0.3s ease-out both;
    }
    .item-entry:hover {
      background: var(--surface-hover);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }

    .item-info { flex: 1; min-width: 0; }
    .item-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .item-specs span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .item-specs .spec-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .item-weight {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
    }
    .item-weight small {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .item-remove {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--danger-light);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .item-remove:hover {
      background: rgba(220, 38, 38, 0.14);
      transform: scale(1.05);
    }

    /* ===== TOTAL ===== */
    .total-card {
      background: var(--accent-light);
      border-color: rgba(22, 163, 74, 0.2);
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-label {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .total-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      transition: all 0.3s ease;
    }
    .total-items-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    @keyframes popIn {
      0%   { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }

    .pop-in { animation: popIn 0.3s ease-out; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      html { font-size: 16px; }
      .app { padding: 20px 14px 70px; }
      .header h1 { font-size: 1.6rem; }
      .header p { font-size: 0.92rem; }
      .card { padding: 22px 18px; }
      .form-grid { grid-template-columns: 1fr; gap: 16px; }
      .total-value { font-size: 1.65rem; }
      .item-specs { font-size: 0.82rem; }
      .item-entry { padding: 16px; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .form-grid { gap: 16px; }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.2); }

    /* Number input arrows */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 0.5;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header__icon">⚖️</div>
    <h1>Material Weight Calculator</h1>
    <p>Calculate total material weight based on your selections</p>
  </header>

  <!-- INPUT FORM -->
  <section class="card card--form" id="formCard">
    <div class="card__title">Add Material Entry</div>
    <div class="form-grid">
      <div class="form-group">
        <label for="selectThickness">Thickness (mm)</label>
        <select id="selectThickness">
          <option value="">Select…</option>
          <option value="0.8">0.8 mm</option>
          <option value="0.9">0.9 mm</option>
          <option value="1.0">1.0 mm</option>
          <option value="1.1">1.1 mm</option>
          <option value="1.2">1.2 mm</option>
          <option value="1.4">1.4 mm</option>
          <option value="1.5">1.5 mm</option>
        </select>
      </div>
      <div class="form-group">
        <label for="selectHeight">Height (inch)</label>
        <select id="selectHeight">
          <option value="">Select…</option>
          <option value="1.5">1.5 inch</option>
          <option value="2">2 inch</option>
          <option value="10">10 inch</option>
        </select>
      </div>
      <div class="form-group">
        <label for="inputLength">Length (feet)</label>
        <input type="number" id="inputLength" placeholder="e.g. 12" min="0.1" step="0.1" />
      </div>
      <div class="form-group">
        <label for="inputQty">Quantity (pcs)</label>
        <input type="number" id="inputQty" placeholder="e.g. 10" min="1" step="1" />
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-actions">
      <button class="btn btn--primary" id="btnAdd" type="button">
        <span>＋</span> Add Item
      </button>
      <button class="btn btn--ghost" id="btnReset" type="button">Reset All</button>
    </div>
  </section>

  <!-- ITEMS LIST -->
  <section class="card card--list" id="listCard">
    <div class="card__title">Added Items</div>
    <div id="itemsList">
      <div class="items-empty" id="emptyState">
        <div class="items-empty__icon">📦</div>
        <p>No items added yet.<br>Use the form above to get started.</p>
      </div>
    </div>
  </section>

  <!-- TOTAL -->
  <section class="card card--total total-card" id="totalCard" style="display: none;">
    <div class="total-row">
      <div>
        <div class="total-label">Grand Total Weight</div>
        <div class="total-items-count" id="totalItemsCount"></div>
      </div>
      <div class="total-value" id="totalWeight">0.000 kg</div>
    </div>
  </section>

</div>

<script>
  /* ===================================================================
     WEIGHT CHART  —  weightChart[thickness][height] = kg per 1 foot
     =================================================================== */
  const weightChart = {
    "0.8":  { "1.5": 0.467, "2": 0.500 },
    "0.9":  { "1.5": 0.525, "2": 0.570 },
    "1.0":  { "1.5": 0.570, "2": 0.640 },
    "1.1":  { "1.5": 0.625, "2": 0.700 },
    "1.2":  { "1.5": 0.695, "2": 0.810, "10": 1.100 },
    "1.4":  { "1.5": 0.800, "2": 0.880, "10": 1.290 },
    "1.5":  { "1.5": 0.860, "2": 0.950 }
  };

  /* ===== STATE ===== */
  let items = loadItems();

  /* ===== DOM REFS ===== */
  const selThickness = document.getElementById("selectThickness");
  const selHeight    = document.getElementById("selectHeight");
  const inpLength    = document.getElementById("inputLength");
  const inpQty       = document.getElementById("inputQty");
  const btnAdd       = document.getElementById("btnAdd");
  const btnReset     = document.getElementById("btnReset");
  const errorMsg     = document.getElementById("errorMsg");
  const itemsList    = document.getElementById("itemsList");
  const emptyState   = document.getElementById("emptyState");
  const totalCard    = document.getElementById("totalCard");
  const totalWeight  = document.getElementById("totalWeight");
  const totalCount   = document.getElementById("totalItemsCount");

  /* ===== INIT ===== */
  render();

  /* ===== EVENT LISTENERS ===== */
  btnAdd.addEventListener("click", addItem);
  btnReset.addEventListener("click", resetAll);

  /* Allow Enter key to add */
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.activeElement.closest("#formCard")) {
      addItem();
    }
  });

  /* Auto-hide error when user changes any input */
  [selThickness, selHeight, inpLength, inpQty].forEach(el => {
    el.addEventListener("input", hideError);
    el.addEventListener("change", hideError);
  });

  /* ===== ADD ITEM ===== */
  function addItem() {
    hideError();

    const thickness = selThickness.value;
    const height    = selHeight.value;
    const length    = parseFloat(inpLength.value);
    const qty       = parseInt(inpQty.value, 10);

    /* Validation */
    if (!thickness || !height) {
      return showError("Please select both thickness and height.");
    }
    if (!length || length <= 0) {
      return showError("Please enter a valid length in feet.");
    }
    if (!qty || qty <= 0) {
      return showError("Please enter a valid quantity (≥ 1).");
    }

    /* Chart lookup */
    const thicknessData = weightChart[thickness];
    if (!thicknessData || thicknessData[height] === undefined) {
      return showError(`No weight data available for ${thickness} mm × ${height}" combination.`);
    }

    const unitWeight = thicknessData[height];
    const totalWt    = unitWeight * length * qty;

    const item = {
      id: Date.now() + Math.random(),
      thickness,
      height,
      length,
      qty,
      unitWeight,
      totalWt
    };

    items.push(item);
    saveItems();
    render();
    clearForm();
  }

  /* ===== REMOVE ITEM ===== */
  function removeItem(id) {
    items = items.filter(i => i.id !== id);
    saveItems();
    render();
  }

  /* ===== RESET ALL ===== */
  function resetAll() {
    if (items.length === 0) return;
    items = [];
    saveItems();
    render();
    clearForm();
  }

  /* ===== RENDER ===== */
  function render() {
    /* Empty state */
    if (items.length === 0) {
      emptyState.style.display = "block";
      totalCard.style.display = "none";
      /* Remove item entries */
      itemsList.querySelectorAll(".item-entry").forEach(el => el.remove());
      return;
    }

    emptyState.style.display = "none";
    totalCard.style.display = "block";

    /* Build items */
    const existingEntries = itemsList.querySelectorAll(".item-entry");
    existingEntries.forEach(el => el.remove());

    items.forEach((item, idx) => {
      const el = document.createElement("div");
      el.className = "item-entry";
      el.style.animationDelay = `${idx * 0.05}s`;
      el.innerHTML = `
        <div class="item-info">
          <div class="item-specs">
            <span><span class="spec-label">T:</span> ${item.thickness} mm</span>
            <span><span class="spec-label">H:</span> ${item.height}"</span>
            <span><span class="spec-label">L:</span> ${item.length} ft</span>
            <span><span class="spec-label">Q:</span> ×${item.qty}</span>
          </div>
          <div class="item-weight">${item.totalWt.toFixed(3)}<small>kg</small></div>
        </div>
        <button class="item-remove" title="Remove item" data-id="${item.id}">✕</button>
      `;
      el.querySelector(".item-remove").addEventListener("click", () => removeItem(item.id));
      itemsList.appendChild(el);
    });

    /* Grand total */
    const grand = items.reduce((sum, i) => sum + i.totalWt, 0);
    totalWeight.textContent = `${grand.toFixed(3)} kg`;
    totalCount.textContent = `${items.length} item${items.length > 1 ? 's' : ''} added`;

    /* Pop animation on total */
    totalWeight.classList.remove("pop-in");
    void totalWeight.offsetWidth; /* trigger reflow */
    totalWeight.classList.add("pop-in");
  }

  /* ===== HELPERS ===== */
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add("visible");
    /* Remove & re-add for shake animation reset */
    errorMsg.style.animation = "none";
    void errorMsg.offsetWidth;
    errorMsg.style.animation = "";
  }
  function hideError() {
    errorMsg.classList.remove("visible");
  }
  function clearForm() {
    selThickness.value = "";
    selHeight.value = "";
    inpLength.value = "";
    inpQty.value = "";
  }

  /* ===== LOCAL STORAGE ===== */
  function saveItems() {
    try {
      localStorage.setItem("mwc_items", JSON.stringify(items));
    } catch (e) { /* quota or private mode */ }
  }
  function loadItems() {
    try {
      const data = localStorage.getItem("mwc_items");
      return data ? JSON.parse(data) : [];
    } catch (e) { return []; }
  }
</script>

</body>
</html>
